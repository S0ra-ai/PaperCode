repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: mypy
        name: mypy (app/core)
        entry: uv run mypy app/core
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-unit
        name: pytest (unit only)
        entry: uv run pytest tests/unit -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
