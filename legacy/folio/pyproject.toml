[project]
name = "folio"
version = "0.1.0"
description = "TUI-native, single-user, agent-style engine that turns a fuzzy academic ask + a sample format into a fully formatted, fully verified paper."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [
    { name = "k1d", email = "zhuchen.zhong@outlook.com" }
]
requires-python = ">=3.11,<3.12"
keywords = ["tui", "academic", "paper", "llm", "agent", "textual"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "textual>=0.85",
    "rich>=13.7",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "httpx>=0.27",
    "docker>=7.1",
    "pdfplumber>=0.11",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "mcp>=1.0",
    "keyring>=25.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-recording>=0.13",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "pre-commit>=3.7",
    "types-PyYAML",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.scripts]
folio = "app.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app/core"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "pytesseract.*", "pdf2image.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: hits real services (network)",
    "e2e: full pipeline runs",
    "slow: > 1s",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
