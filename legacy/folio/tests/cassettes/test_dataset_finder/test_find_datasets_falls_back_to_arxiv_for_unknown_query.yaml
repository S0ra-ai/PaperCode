        \ <entry>\n    <id>http://arxiv.org/abs/2405.19595v1</id>\n    <title>The
        RSNA Abdominal Traumatic Injury CT (RATIC) Dataset</title>\n    <updated>2024-05-30T01:18:50Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2405.19595v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2405.19595v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>The RSNA Abdominal Traumatic Injury CT (RATIC)
        dataset is the largest publicly available collection of adult abdominal CT
        studies annotated for traumatic injuries. This dataset includes 4,274 studies
        from 23 institutions across 14 countries. The dataset is freely available
        for non-commercial use via Kaggle at https://www.kaggle.com/competitions/rsna-2023-abdominal-trauma-detection.
        Created for the RSNA 2023 Abdominal Trauma Detection competition, the dataset
        encourages the development of advanced machine learning models for detecting
        abdominal injuries on CT scans. The dataset encompasses detection and classification
        of traumatic injuries across multiple organs, including the liver, spleen,
        kidneys, bowel, and mesentery. Annotations were created by expert radiologists
        from the American Society of Emergency Radiology (ASER) and Society of Abdominal
        Radiology (SAR). The dataset is annotated at multiple levels, including the
        presence of injuries in three solid organs with injury grading, image-level
        annotations for active extravasations and bowel injury, and voxelwise segmentations
        of each of the potentially injured organs. With the release of this dataset,
        we hope to facilitate research and development in machine learning and abdominal
        trauma that can lead to improved patient care and outcomes.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2024-05-30T01:18:50Z</published>\n
