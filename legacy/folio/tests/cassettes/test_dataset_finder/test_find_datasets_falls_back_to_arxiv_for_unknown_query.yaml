        Spatial Dynamic Wind Power Forecasting over a Large Turbine Array. The released
        sdwpf_full dataset provides more comprehensive information than the dataset
        made available for the KDD Cup 2022</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.LG\"/>\n    <arxiv:journal_ref>Zhou, J., Lu, X., Xiao, Y. et al.
        SDWPF: A Dataset for Spatial Dynamic Wind Power Forecasting over a Large Turbine
        Array. Sci Data 11, 649 (2024)</arxiv:journal_ref>\n    <author>\n      <name>Jingbo
