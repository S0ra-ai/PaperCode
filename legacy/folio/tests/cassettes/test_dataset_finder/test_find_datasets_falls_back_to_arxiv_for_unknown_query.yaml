        \     <name>Errol Colak</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2506.09162v1</id>\n
        \   <title>The RSNA Lumbar Degenerative Imaging Spine Classification (LumbarDISC)
        Dataset</title>\n    <updated>2025-06-10T18:23:01Z</updated>\n    <link href=\"https://arxiv.org/abs/2506.09162v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2506.09162v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>The
        Radiological Society of North America (RSNA) Lumbar Degenerative Imaging Spine
        Classification (LumbarDISC) dataset is the largest publicly available dataset
        of adult MRI lumbar spine examinations annotated for degenerative changes.
        The dataset includes 2,697 patients with a total of 8,593 image series from
        8 institutions across 6 countries and 5 continents. The dataset is available
        for free for non-commercial use via Kaggle and RSNA Medical Imaging Resource
        of AI (MIRA). The dataset was created for the RSNA 2024 Lumbar Spine Degenerative
        Classification competition where competitors developed deep learning models
        to grade degenerative changes in the lumbar spine. The degree of spinal canal,
        subarticular recess, and neural foraminal stenosis was graded at each intervertebral
        disc level in the lumbar spine. The images were annotated by expert volunteer
        neuroradiologists and musculoskeletal radiologists from the RSNA, American
        Society of Neuroradiology, and the American Society of Spine Radiology. This
        dataset aims to facilitate research and development in machine learning and
        lumbar spine imaging to lead to improved patient care and clinical efficiency.</summary>\n
