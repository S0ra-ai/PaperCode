      string: "<?xml version='1.0' encoding='UTF-8'?>\n<feed xmlns:opensearch=\"http://a9.com/-/spec/opensearch/1.1/\"
        xmlns:arxiv=\"http://arxiv.org/schemas/atom\" xmlns=\"http://www.w3.org/2005/Atom\">\n
        \ <id>https://arxiv.org/api/1xd4X23r7JBVq8c1TUgQkHeKtmo</id>\n  <title>arXiv
        Query: search_query=all:katz87&amp;id_list=&amp;start=0&amp;max_results=1</title>\n
        \ <updated>2026-04-22T15:35:40Z</updated>\n  <link href=\"https://arxiv.org/api/query?search_query=all:katz87&amp;start=0&amp;max_results=1&amp;id_list=\"
        type=\"application/atom+xml\"/>\n  <opensearch:itemsPerPage>1</opensearch:itemsPerPage>\n
        \ <opensearch:totalResults>1</opensearch:totalResults>\n  <opensearch:startIndex>0</opensearch:startIndex>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2309.11742v2</id>\n    <title>Differential
        Galois groups of $G$-connections with Coxeter singularities</title>\n    <updated>2026-02-19T22:38:14Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2309.11742v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2309.11742v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>A fundamental theorem of Katz \\cite{Katz87}
        determines the differential Galois groups of rank $n$ connections on algebraic
        curves with slope $r/n$ at a singularity, where $\\gcd(r,n)=1$. We extend
        this result to $G$-connections, where $G$ is a simple algebraic group and
        the slope is $r/h$, with $h$ the Coxeter number of $G$ and $\\gcd(r,h)=1$.
        This allows us to compute the differential Galois groups of a broad class
        of $G$-connections that have been central to recent advances in the geometric
        Langlands program and the Deligne--Simpson problem -- namely, Coxeter connections,
        generalised Frenkel--Gross connections, and Airy connections. We apply our
        results to inverse differential Galois theory by giving uniform and explicit
        constructions of $G$-connections whose differential Galois groups realise
        all reductive subgroups of maximal degree.</summary>\n    <category term=\"math.AG\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"math.RT\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2023-09-21T02:34:49Z</published>\n
        \   <arxiv:comment>The manuscript has been thoroughly revised and substantially
        rewritten. In addition, we have included a major new theorem on inverse differential
        Galois theory. The title has been changed since the previous submission</arxiv:comment>\n
        \   <arxiv:primary_category term=\"math.AG\"/>\n    <author>\n      <name>Masoud
        Kamgarpour</name>\n    </author>\n    <author>\n      <name>Daniel S. Sage</name>\n
        \   </author>\n  </entry>\n</feed>\n"
