        Meteorological Society","issue":"5","content-domain":{"domain":[],"crossmark-restriction":false},"published-print":{"date-parts":[[2015,10,1]]},"abstract":"<jats:title>Abstract<\/jats:title>\n               <jats:p>The
        National Hurricane Center (NHC) has been forecasting gale force wind radii
        for many years, and more recently (starting in 2004) began routine postanalysis
        or \u201cbest tracking\u201d of the maximum radial extent of gale [34 knots
        (kt; 1 kt = 0.514 m s\u22121)] force winds in compass quadrants surrounding
        the tropical cyclone (wind radii). At approximately the same time, a statistical
        wind radii forecast, based solely on climatology and persistence, was implemented
        so that wind radii forecasts could be evaluated for skill. If the best-track
        gale radii are used as ground truth (even accounting for random errors in
        the analyses), the skill of the NHC forecasts appears to be improving at 2-
        and 3-day lead times, suggesting that the guidance has also improved. In this
        paper several NWP models are evaluated for their skill, an equally weighted
        average or \u201cconsensus\u201d of the model forecasts is constructed, and
        finally the consensus skill is evaluated. The results are similar to what
        is found with tropical cyclone track and intensity in that the consensus skill
        is comparable to or better than that of the individual models. Furthermore,
        the consensus skill is high enough to be of potential use as forecast guidance
        or as a proxy for official gale force wind radii forecasts at the longer lead
        times.<\/jats:p>","DOI":"10.1175\/waf-d-15-0009.1","type":"journal-article","created":{"date-parts":[[2015,6,15]],"date-time":"2015-06-15T19:16:31Z","timestamp":1434395791000},"page":"1397-1403","source":"Crossref","is-referenced-by-count":24,"title":["A
