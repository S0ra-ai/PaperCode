      string: '{"status":"ok","message-type":"work-list","message-version":"1.0.0","message":{"facets":{},"total-results":3903800,"items":[{"indexed":{"date-parts":[[2025,12,22]],"date-time":"2025-12-22T12:39:53Z","timestamp":1766407193624,"version":"3.45.0"},"posted":{"date-parts":[[2022,3,14]]},"group-title":"Open
        Science Framework","reference-count":0,"publisher":"Center for Open Science","license":[{"start":{"date-parts":[[2022,3,14]],"date-time":"2022-03-14T00:00:00Z","timestamp":1647216000000},"content-version":"unspecified","delay-in-days":0,"URL":"https:\/\/creativecommons.org\/licenses\/by\/4.0\/legalcode"}],"content-domain":{"domain":[],"crossmark-restriction":false},"abstract":"<p>To
        estimate the \u201dbiodiversity\u201d in a particular area \u2013 or, in other
        words, the number of unique species living in a given environment \u2013 ecologists
        usually have no other option than to rely on incomplete samples. For all sorts
        of practical reasons, it is virtually impossible to spot all species that
        are actually present in an area, and hence certain species will be missing
        in the counts. Consequently, an important research question in ecology is
        how to reliably estimate the resulting \u201dbias\u201d between the number
        of species that was observerd and the true number of unique species in an
        area. In this brief note, I try to demystify a famous unseen species model,
        Chao1, in terms of Turing\u2019s work. I hope that this will help people unfamiliar
        with the method to understand exactly how it works, and, perhaps more importantly,
        how (not) to interpret the calculated values<\/p>","DOI":"10.31219\/osf.io\/tb9w2","type":"posted-content","created":{"date-parts":[[2022,3,14]],"date-time":"2022-03-14T12:25:42Z","timestamp":1647260742000},"source":"Crossref","is-referenced-by-count":1,"title":["Demystifying
        Chao1 with Good-Turing"],"prefix":"10.31219","author":[{"ORCID":"https:\/\/orcid.org\/0000-0002-5958-0551","authenticated-orcid":true,"given":"Folgert
        Bastiaan","family":"Karsdorp","sequence":"first","affiliation":[]}],"member":"15934","deposited":{"date-parts":[[2025,11,20]],"date-time":"2025-11-20T11:53:35Z","timestamp":1763639615000},"score":22.601099,"resource":{"primary":{"URL":"https:\/\/osf.io\/tb9w2_v1"}},"issued":{"date-parts":[[2022,3,14]]},"references-count":0,"URL":"https:\/\/doi.org\/10.31219\/osf.io\/tb9w2","published":{"date-parts":[[2022,3,14]]},"subtype":"preprint"}],"items-per-page":1,"query":{"start-index":0,"search-terms":"chen-good-turing"}}}'
