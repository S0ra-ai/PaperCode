        Inc."}],"indexed":{"date-parts":[[2025,6,3]],"date-time":"2025-06-03T16:42:48Z","timestamp":1748968968582,"version":"3.41.0"},"posted":{"date-parts":[[2024,5,7]]},"group-title":"Preprints","reference-count":0,"publisher":"Wiley","content-domain":{"domain":[],"crossmark-restriction":false},"accepted":{"date-parts":[[2024,5,7]]},"abstract":"<jats:p
        id=\"p1\">\n      <jats:bold>Document clustering plays a pivotal role in structuring
        and\nanalyzing vast textual datasets. In this paper, we leverage the\nBidirectional
        Encoder Representations from Transformers (BERT)\nalgorithm, a cutting-edge
        natural language processing model, to perform\ndocument clustering on three
        distinct datasets: the 20News Group\ndataset, Reuters dataset, and BBC Sports
        dataset. BERT\u2019s contextualized\nembeddings enable a deeper understanding
        of document semantics,\nenhancing the clustering process. The objective is
        to investigate the\nefficacy of BERT-based document clustering across diverse
        domains,\nshedding light on its performance and potential applications. We\nimplement
        BERT for document clustering, utilizing its pre-trained\ncontextual embeddings
        to capture intricate relationships within textual\ndata. Our study aims to
        assess how well BERT adapts to the unique\ncharacteristics of each dataset,
        offering insights into the model\u2019s\ngeneralizability and effectiveness
        across various domains.<\/jats:bold>\n    <\/jats:p>","DOI":"10.22541\/au.171506422.20645846\/v1","type":"posted-content","created":{"date-parts":[[2024,5,7]],"date-time":"2024-05-07T06:43:46Z","timestamp":1715064226000},"source":"Crossref","is-referenced-by-count":0,"title":["BERT-based
