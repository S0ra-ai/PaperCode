server {
    listen 80;
    server_name _;

    # Docker 内置 DNS，防止 upstream IP 缓存导致 502
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    # ── Request body limit (match backend's 50MB limit) ──
    client_max_body_size 50m;

    # ── Security headers ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Gzip compression ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # ── SPA entry point (no-cache so users always get the latest index.html) ──
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── Vite hashed static assets (immutable, 1-year cache) ──
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Backend reverse proxy ──
    location /backend/ {
        set $api_upstream http://api:9992;
        rewrite ^/backend/(.*) /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass_header Set-Cookie;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # ── Uploaded file proxy ──
    location /uploads/ {
        set $api_upstream http://api:9992;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }
}
