[alembic]
script_location = alembic
# sqlalchemy.url is overridden at runtime by env.py from app.platform.config
# The value below is only a fallback for standalone tooling.
sqlalchemy.url = postgresql+psycopg2://intelligen:intelligen123@postgresql:5432/intelligen

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
