# Model Router Configuration
# Task-type-specific LLM parameters for IntelliGen

profiles:
  planning:
    # Outline generation — fast, deterministic
    temperature: 0.1
    max_tokens: 4096
    timeout: 120

  writing:
    # Section content generation — creative but controlled
    temperature: 0.3
    max_tokens: 32768
    timeout: 300

  summary:
    # Section summary compression — deterministic
    temperature: 0.0
    max_tokens: 2048
    timeout: 60

  keyword:
    # Keyword extraction / translation — deterministic
    temperature: 0.0
    max_tokens: 1024
    timeout: 60

  review:
    # Quality review / final pass — deterministic
    temperature: 0.0
    max_tokens: 8192
    timeout: 180
