[project]
name = "paper-fucker-research-tools"
version = "0.1.0"
description = "Python MCP and CLI research helpers for paper_fucker."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_fucker_tools"]
