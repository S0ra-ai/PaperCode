[project]
name = "papercode-research-tools"
version = "0.1.0"
description = "Python MCP and CLI research helpers for papercode."
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1,<2",
    "mcp>=1,<2",
    "pydantic>=2,<3",
    "pypdf>=5,<7",
    "python-docx>=1,<2",
    "scrapling>=0.3,<1",
    "trackio>=0.20,<1",
]

[project.scripts]
papercode-tools = "papercode_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papercode_tools"]
