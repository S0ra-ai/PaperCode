# TaskFlow preferences for this project.

git:
  branch_model: gitflow
  remote_mode: pr
  use_gh: true

changelog:
  path: CHANGELOG
  archive_dir: docs/changelog
  minor_split_line_threshold: 300
  indentation: four-space-colon-dsl
  version_policy: extended-semver
  format: colon-history

execution:
  max_concurrent_tasks: 1
  default_retry: 0
  default_step_timeout: null

watcher:
  polling: false
