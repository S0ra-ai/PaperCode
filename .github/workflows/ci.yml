name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # The full suite takes ~27 minutes and needs pandoc, a TeX engine and the
      # research-tools Python environment; this is the fast gate that catches
      # regressions in the config/provider layer and the paper model inventory.
      - name: Unit tests (config, provider, paper model inventory)
        working-directory: packages/opencode
        run: |
          bun test test/config test/provider test/paper/model-discovery.test.ts \
            --timeout 60000
