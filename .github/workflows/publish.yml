name: publish

# Invoked by script/release: gh workflow run publish.yml -f bump=patch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build binaries
        working-directory: packages/opencode
        run: bun run script/build.ts --single
      # Publishing to npm/Homebrew/GitHub releases additionally needs the
      # registry tokens and signing keys; until those secrets are configured
      # this job only proves that a release build succeeds.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: papercode-${{ inputs.bump }}
          path: packages/opencode/dist/**/bin/*
          if-no-files-found: error
